[pytest]
minversion = 7.0
; Makes the repo root importable as "src...." without installing the package.
pythonpath = .
testpaths = tests
markers =
    unit: fast, isolated tests with no I/O and no heavy/real dependencies
    integration: tests exercising several real modules together
    gui: tests that instantiate Tkinter/CustomTkinter widgets
addopts = -ra
